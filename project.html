<!DOCTYPE html>
<html>
<head>
<title>Project Workspace</title>

<style>

body{
font-family:Arial;
background:#eef4ff;
margin:0;
}

.wrap{
max-width:1200px;
margin:auto;
padding:40px;
}

.card{
background:white;
padding:25px;
border-radius:16px;
margin-top:20px;
box-shadow:0 10px 30px rgba(0,0,0,.08);
}

.top{
display:flex;
justify-content:space-between;
align-items:center;
}

.button{
background:#1696c4;
color:white;
padding:12px 20px;
border-radius:8px;
text-decoration:none;
border:none;
cursor:pointer;
}

.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:20px;
margin-top:20px;
}

textarea{
width:100%;
height:160px;
padding:12px;
border-radius:8px;
border:1px solid #ccc;
}

input{
width:100%;
padding:12px;
border-radius:8px;
border:1px solid #ccc;
}

</style>

</head>

<body>

<div class="wrap">

<div class="top">

<div>
<h1 id="project-name">Project Workspace</h1>
<p id="project-client"></p>
</div>

<a href="/projects.html" class="button">
Back To Projects
</a>

</div>

<div class="card">

<h2>Project Overview</h2>

<div class="grid">

<div>
<label>Project Status</label>
<select id="projectStatus">
<option value="Estimating">Estimating</option>
<option value="Bid Submitted">Bid Submitted</option>
<option value="Awarded">Awarded</option>
<option value="Lost">Lost</option>
</select>
</div>

<div>
<label>Bid Due Date</label>
<input type="date" id="bidDueDate">
</div>

</div>

<div class="grid">

<div>
<label>Estimator</label>
<input id="estimator">
</div>

<div>
<label>Estimated Value ($)</label>
<input type="number" id="projectValue">
</div>

<div>
<label>Win Probability (%)</label>
<input type="number" id="winProbability">
</div>

</div>

<br>

<input id="projectNotes"
placeholder="Project notes, scope, bid strategy, assumptions">

</div>

<div class="grid">

<div class="card">

<h2>Documents</h2>

<select id="fileCategory">
  <option value="plans">Plans</option>
  <option value="specifications">Specifications</option>
  <option value="addenda">Addenda</option>
  <option value="quotes">Quotes</option>
</select>

<input id="fileInput" type="file">
<button id="uploadBtn" class="button">Upload File</button>
<div id="uploadStatus" style="margin-top:10px;color:green;font-weight:bold;"></div>

<div id="fileList" style="margin-top:15px;"></div>

</div>

<div class="card">

<h2>AI Actions</h2>

<button id="analyzeBtn" class="button">
Analyze Documents
</button>

<br><br>

<button id="estimateBtn" class="button">
Generate Estimate
</button>

<br><br>

<button id="rfiBtn" class="button">
Generate RFIs
</button>

<br><br>

<button id="proposalBtn" class="button">
Create Proposal
</button>

</div>

</div>

<div class="card">

<h2>Estimate Builder</h2>

<textarea id="estimateBox" placeholder="Estimate output will appear here"></textarea>

</div>

<div class="card">

<h2>RFIs</h2>

<textarea id="rfiBox" placeholder="Generated RFIs"></textarea>

</div>

<div class="card">

<h2>Proposal</h2>

<textarea id="proposalBox" placeholder="Proposal draft"></textarea>

</div>

</div>

<script type="module">

import { supabase } from "/supabase-client.js";

const params = new URLSearchParams(window.location.search);

const projectId = params.get("id");
let currentProject = null;

if(projectId){

const { data } = await supabase
.from("projects")
.select("*")
.eq("id", projectId)
.single();

if(data){

currentProject = data;

document.getElementById("project-name").innerText =
(data.job_number ? "JOB " + data.job_number + " | " : "") +
(data.estimate_number ? data.estimate_number + " - " : "") +
data.name;

document.getElementById("project-client").innerText =
"Client: " + (data.client_name || "");

}
}

async function loadWorkspace(){

const { data } = await supabase
.from("project_workspace")
.select("*")
.eq("project_id", projectId)
.single();

if(!data) return;

document.getElementById("projectStatus").value =
data.project_status || currentProject?.status || "Estimating";

document.getElementById("bidDueDate").value =
data.bid_due_date || "";

document.getElementById("estimator").value =
data.estimator || "";

document.getElementById("projectValue").value =
data.project_value || "";

document.getElementById("winProbability").value =
data.win_probability || "";  
  
document.getElementById("projectNotes").value =
data.notes || "";

document.getElementById("estimateBox").value =
data.estimate || "";

document.getElementById("rfiBox").value =
data.rfis || "";

document.getElementById("proposalBox").value =
data.proposal || "";

}

async function saveWorkspace(){
if(
document.getElementById("projectStatus").value === "Awarded" &&
currentProject &&
!currentProject.job_number
){

const { data: nextJob, error: jobError } = await supabase.rpc(
"get_next_job_number",
{
org_id: currentProject.organization_id
}
);

if(jobError){
alert("Job number error: " + jobError.message);
return;
}

currentProject.job_number = nextJob;

const { error: updateError } = await supabase
.from("projects")
.update({
job_number: nextJob,
awarded_at: new Date().toISOString(),
status: "Awarded"
})
.eq("id", projectId);

if(updateError){
alert("Project update error: " + updateError.message);
return;
}

}
const payload = {
project_id: projectId,

project_status:
document.getElementById("projectStatus").value,

bid_due_date:
document.getElementById("bidDueDate").value,

estimator:
document.getElementById("estimator").value,

project_value:
document.getElementById("projectValue").value,

win_probability:
document.getElementById("winProbability").value,

notes:
document.getElementById("projectNotes").value,

estimate:
document.getElementById("estimateBox").value,

rfis:
document.getElementById("rfiBox").value,

proposal:
document.getElementById("proposalBox").value
};

await supabase
.from("project_workspace")
.upsert(payload, {
onConflict: "project_id"
});

}

document.getElementById("projectStatus")
.addEventListener("change", saveWorkspace);

document.getElementById("bidDueDate")
.addEventListener("change", saveWorkspace);

document.getElementById("estimator")
.addEventListener("change", saveWorkspace);

document.getElementById("projectValue")
.addEventListener("change", saveWorkspace);

document.getElementById("winProbability")
.addEventListener("change", saveWorkspace);
  
document.getElementById("projectNotes")
.addEventListener("change", saveWorkspace);

document.getElementById("estimateBox")
.addEventListener("change", saveWorkspace);

document.getElementById("rfiBox")
.addEventListener("change", saveWorkspace);

document.getElementById("proposalBox")
.addEventListener("change", saveWorkspace);

document.getElementById("estimateBtn")
.addEventListener("click", async () => {

const notes =
document.getElementById("projectNotes").value;

document.getElementById("estimateBox").value =

`GROUNDUP ESTIMATE

PROJECT NOTES:
${notes}

DIRECT COSTS
--------------------
Labor:
Materials:
Equipment:
Subcontractors:

INDIRECT COSTS
--------------------
Mobilization:
Supervision:
Insurance:
Bond:

MARKUP
--------------------
Overhead:
Profit:

TOTAL ESTIMATE:
`;

await saveWorkspace();

});


document.getElementById("rfiBtn")
.addEventListener("click", async () => {

const notes =
document.getElementById("projectNotes").value;

document.getElementById("rfiBox").value =

`RFI #1

Project:
${document.getElementById("project-name").innerText}

Question:
Please clarify scope requirements related to:

${notes}

Requested Response:
Provide direction and intent.
`;

await saveWorkspace();

});


document.getElementById("proposalBtn")
.addEventListener("click", async () => {

document.getElementById("proposalBox").value =

`GROUNDUP ESTIMATING PRO

We are pleased to provide this proposal
for the referenced project.

Scope:
Work will be completed in accordance
with the plans, specifications, and
contract requirements.

Pricing:
See attached estimate.

Thank you for the opportunity to bid.

Sincerely,

GroundUp Estimating Pro
`;

await saveWorkspace();

});


document.getElementById("analyzeBtn")
.addEventListener("click", async () => {

alert("Document analysis will be connected after file uploads are enabled.");

});

async function uploadFile(){

const uploadBtn = document.getElementById("uploadBtn");
const file = document.getElementById("fileInput").files[0];
const category = document.getElementById("fileCategory").value;

if(!file){
alert("Choose a file first.");
return;
}

uploadBtn.disabled = true;
uploadBtn.innerText = "Uploading...";

const cleanName = file.name.replaceAll("/", "-");
const filePath = projectId + "/" + category + "/" + cleanName;

const { error } = await supabase.storage
.from("project-files")
.upload(filePath, file, {
upsert: true
});

uploadBtn.disabled = false;
uploadBtn.innerText = "Upload File";

if(error){
alert("Upload failed: " + error.message);
return;
}

document.getElementById("uploadStatus").innerText =
"✓ Uploaded to " + category;

setTimeout(() => {
document.getElementById("uploadStatus").innerText = "";
}, 3000);
document.getElementById("fileInput").value = "";
loadFiles();

}

async function loadFiles(){

const categories = ["plans", "specifications", "addenda", "quotes"];
const list = document.getElementById("fileList");
list.innerHTML = "";

for (const category of categories) {

const heading = document.createElement("strong");
heading.innerText = category.toUpperCase();
list.appendChild(heading);

const { data, error } = await supabase.storage
.from("project-files")
.list(projectId + "/" + category);

if(error || !data || data.length === 0){
const empty = document.createElement("div");
empty.innerText = "No files";
empty.style.marginBottom = "10px";
list.appendChild(empty);
continue;
}

data.forEach(file => {
const div = document.createElement("div");

const filePath = projectId + "/" + category + "/" + file.name;

const openBtn = document.createElement("button");
openBtn.innerText = "Open";
openBtn.style.marginLeft = "8px";

openBtn.onclick = async () => {
  const { data } = await supabase.storage
    .from("project-files")
    .createSignedUrl(filePath, 60);

  if(data?.signedUrl){
    window.open(data.signedUrl, "_blank");
  }
};

div.innerText = file.name + " ";

div.appendChild(openBtn);

const deleteBtn = document.createElement("button");
deleteBtn.innerText = "Delete";
deleteBtn.style.marginLeft = "8px";

deleteBtn.onclick = async () => {

if(!confirm("Delete this file?")) return;

await supabase.storage
.from("project-files")
.remove([filePath]);

loadFiles();

};

div.appendChild(deleteBtn);

list.appendChild(div);

const spacer = document.createElement("div");
spacer.style.marginBottom = "10px";
list.appendChild(spacer);

});

}

}

document.getElementById("uploadBtn")
.addEventListener("click", uploadFile);

loadFiles();
  
loadWorkspace();
  
</script>

</body>
</html>
